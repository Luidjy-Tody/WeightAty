<ion-input
  #nativeInput
  class="wat-label-bold password-field ion-touched"
  labelPlacement="stacked"
  fill="outline"
  [formControl]="control()"
  [label]="label()"
  [placeholder]="placeholder()"
  [type]="visible() ? 'text' : 'password'"
  [autocomplete]="autocomplete()"
  autocapitalize="off"
  spellcheck="false"
  enterkeyhint="done"
  [errorText]="errorText() ?? undefined"
>
  <button
    slot="end"
    type="button"
    class="password-field__toggle"
    [attr.aria-label]="toggleLabel()"
    [attr.aria-pressed]="visible()"
    (click)="toggle()"
  >
    <ion-icon [name]="visible() ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true"></ion-icon>
  </button>
</ion-input>
