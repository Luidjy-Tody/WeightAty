<dl class="stats-card" aria-label="Statistiques du profil">
  <div class="stats-card__item">
    <dt class="stats-card__label">Envois</dt>
    <dd class="stats-card__value">{{ stats().envois }}</dd>
  </div>
  <div class="stats-card__item">
    <dt class="stats-card__label">Trajets</dt>
    <dd class="stats-card__value">{{ stats().trajets }}</dd>
  </div>
  <div class="stats-card__item">
    <dt class="stats-card__label">Fiabilité</dt>
    <dd class="stats-card__value">{{ stats().fiabilite }}%</dd>
  </div>
</dl>
