<div class="location">
  <div class="location__field">
    <ion-input
      #nativeInput
      labelPlacement="stacked"
      fill="outline"
      [label]="label()"
      [placeholder]="placeholder()"
      [value]="query()"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="next"
      (ionInput)="onInput($event)"
      (ionFocus)="onFocus()"
      (ionBlur)="onBlur()"
    >
      @if (searching()) {
        <ion-spinner slot="end" name="crescent"></ion-spinner>
      } @else {
        <ion-icon slot="end" name="location-outline" aria-hidden="true"></ion-icon>
      }
    </ion-input>

    @if (open() && results().length > 0) {
      <ul class="location__results">
        @for (airport of results(); track airport.iata) {
          <li>
            <button
              type="button"
              class="location__option"
              [disabled]="isExcluded(airport)"
              (mousedown)="select(airport)"
            >
              <span class="location__option-label">{{ airport.label }}</span>
              <span class="location__option-meta">{{ airport.name }} · {{ airport.country }}</span>
            </button>
          </li>
        }
      </ul>
    }
  </div>

  @if (errorText(); as message) {
    <p class="field-error" role="alert">{{ message }}</p>
  }
</div>
